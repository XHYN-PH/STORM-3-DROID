name: R2 UI inspection
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Passing R2 Android validation run
        required: true
        type: string
      font:
        description: Font scale artifact
        default: '1.0'
        type: string
permissions:
  actions: read
  contents: read
jobs:
  previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      R2_RUN_ID: ${{ inputs.run_id }}
      R2_FONT: ${{ inputs.font }}
    steps:
      - name: Read screenshots from the passing Android run
        run: |
          set -euo pipefail
          gh run download "$R2_RUN_ID" --name "R2-Android-validation-$R2_FONT" --dir results
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('results/android-instrumentation.txt').read_text()
          if 'R2_STALL_STAGE=' in text:
              at=text.index('R2_STALL_STAGE=')
              trace=text[max(0,at-3000):at+200].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=R2 idle trace::'+trace)
          assert 'R2_ANDROID_RESULT=FAIL' not in text
          result=re.search(r'R2_ANDROID_RESULT=PASS assertions=\d+',text).group()
          print('::notice title=R2 Android result::'+result)
          PY
          cat > preview.py <<'PY'
          import base64,sys
          from pathlib import Path
          name,part=sys.argv[1],int(sys.argv[2])
          data=Path(f'results/{name}.preview.jpg').read_bytes()
          assert data.endswith(b'\xff\xd9')
          encoded=base64.b64encode(data).decode()
          chunks=[encoded[i:i+3500] for i in range(0,len(encoded),3500)]
          assert len(chunks)<=18
          for i in range((part-1)*9,min(part*9,len(chunks))):
              print(f'::notice title=R2 preview {name} {i+1:02d}/{len(chunks):02d}::'+chunks[i])
          PY
      - name: Launcher preview first half
        run: python3 preview.py launcher 1
      - name: Launcher preview second half
        run: python3 preview.py launcher 2
      - name: Controller preview first half
        run: python3 preview.py controller 1
      - name: Controller preview second half
        run: python3 preview.py controller 2
      - name: display preview part 1
        run: python3 preview.py display 1
      - name: display preview part 2
        run: python3 preview.py display 2
      - name: game-menu preview part 1
        run: python3 preview.py game-menu 1
      - name: game-menu preview part 2
        run: python3 preview.py game-menu 2
