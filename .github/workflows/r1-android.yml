name: R1 Android validation
on:
  push:
    paths: ['r1/**', '.github/workflows/r1-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-11:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install official Android test/build packages
        run: |
          set -euo pipefail
          sdkmanager 'ndk;28.2.13676358' 'build-tools;35.0.0' 'platforms;android-30' 'system-images;android-30;google_apis;x86_64'
          mkdir -p "$RUNNER_TEMP/r1-tools" "$RUNNER_TEMP/r1-results"
          curl -fLsS -o "$RUNNER_TEMP/r1-tools/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/r1-tools/apktool.jar" | sha256sum -c -
          curl -fLsS -o "$RUNNER_TEMP/r1-tools/upstream.apk" https://github.com/Masterllgod/naruto-storm-3-full-burst-port-nativo/releases/download/v0.6.16/NarutoStorm3FullBurst-PortNativo-v0.6.16-arm64.apk
          echo "15fcff17b64b29de84a205ea763cef71172f1086d61981c94b0d42f6257c9ecf  $RUNNER_TEMP/r1-tools/upstream.apk" | sha256sum -c -
      - name: Build source with an ephemeral CI test key
        run: |
          set -euo pipefail
          printf 'android\n' > "$RUNNER_TEMP/r1-tools/test.pass"
          keytool -genkeypair -alias xhyn-r1 -keyalg RSA -keysize 2048 -validity 2 -storetype PKCS12 -keystore "$RUNNER_TEMP/r1-tools/test.p12" -storepass:file "$RUNNER_TEMP/r1-tools/test.pass" -dname 'CN=XHYN_PH CI Test Only'
          python3 r1/build_r1.py --upstream "$RUNNER_TEMP/r1-tools/upstream.apk" --apktool "$RUNNER_TEMP/r1-tools/apktool.jar" --ndk "$ANDROID_HOME/ndk/28.2.13676358" --build-tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$RUNNER_TEMP/r1-tools/test.p12" --password-file "$RUNNER_TEMP/r1-tools/test.pass" --output "$RUNNER_TEMP/r1-results/R1-ci-only.apk"
          python3 r1/tests/android/build_tests.py --android-jar "$ANDROID_HOME/platforms/android-30/android.jar" --build-tools "$ANDROID_HOME/build-tools/35.0.0" --keystore "$RUNNER_TEMP/r1-tools/test.p12" --password-file "$RUNNER_TEMP/r1-tools/test.pass" --output "$RUNNER_TEMP/r1-tools/R1-tests.apk"
      - name: Start hardware-accelerated Android 11 with ARM translation
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name R1_API30 --package 'system-images;android-30;google_apis;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd R1_API30 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 3072 -no-metrics > "$RUNNER_TEMP/r1-results/emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell getprop ro.product.cpu.abilist
      - name: Test the R1 Android interface and native logging integration
        run: |
          set -euo pipefail
          adb install --no-incremental -r "$RUNNER_TEMP/r1-results/R1-ci-only.apk"
          adb install --no-incremental -t -r "$RUNNER_TEMP/r1-tools/R1-tests.apk"
          adb logcat -c
          timeout 600 adb shell am instrument -w -r com.naruto.storm3.r1tests/com.naruto.r1tests.R1Instrumentation | tee "$RUNNER_TEMP/r1-results/android-instrumentation.txt"
          adb logcat -d -s R1_NATIVE_TEST:I > "$RUNNER_TEMP/r1-results/logging-markers.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['RUNNER_TEMP'])/'r1-results'
          result=(root/'android-instrumentation.txt').read_text()
          assert 'R1_ANDROID_RESULT=PASS' in result, result
          assert 'R1_ANDROID_RESULT=FAIL' not in result, result
          markers=(root/'logging-markers.txt').read_text()
          assert 'R1_LOGGING_ON_MARKER' in markers, markers
          assert 'R1_LOGGING_OFF_MARKER' not in markers, markers
          print('PASS: Android instrumentation and real app logcat On/Off markers')
          PY
      - name: Retain validation reports, not the temporary signing key/APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R1-Android-validation
          path: |
            ${{ runner.temp }}/r1-results/*.txt
            ${{ runner.temp }}/r1-results/*.json
            ${{ runner.temp }}/r1-results/*.log
          if-no-files-found: ignore
